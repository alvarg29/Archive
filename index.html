<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <title>Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f3ed;
      --surface: #fffefa;
      --surface-warm: #f1ede5;
      --ink: #292a25;
      --muted: #85847b;
      --line: #e8e4dc;
      --olive: #65705a;
      --olive-dark: #4b5742;
      --olive-pale: #e8ebe2;
      --clay: #b77962;
      --shadow: 0 16px 40px rgba(48, 45, 37, .07);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 var(--sans);
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid rgba(101, 112, 90, .35);
      outline-offset: 2px;
    }
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 3;
      display: flex;
      width: 244px;
      flex-direction: column;
      padding: 32px 20px 22px;
      border-right: 1px solid var(--line);
      background: #faf8f3;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      background: var(--olive);
      color: white;
    }
    .brand-mark svg { width: 20px; height: 20px; }
    .brand-name { font: 600 23px/1 var(--serif); letter-spacing: -.4px; }
    .side-label { margin: 47px 10px 12px; color: #a09d93; font-size: 10px; font-weight: 700; letter-spacing: 1.35px; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 10px 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #6f7068;
      cursor: pointer;
      text-align: left;
      transition: background .18s, color .18s;
    }
    .nav-item:hover { background: #f0eee7; color: var(--ink); }
    .nav-item.active { background: var(--olive-pale); color: var(--olive-dark); font-weight: 600; }
    .nav-item svg { width: 17px; height: 17px; flex: none; }
    .nav-count { margin-left: auto; color: #96958c; font-size: 12px; font-variant-numeric: tabular-nums; }
    .sidebar-bottom { margin-top: auto; }
    .import-card { padding: 0; }
    .import-link { display: inline-flex; min-height: 42px; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: #fffefa; color: var(--olive-dark); cursor: pointer; font-size: 12px; font-weight: 600; }
    .import-link:hover { border-color: #d7d4cb; background: #f5f3ed; }
    .main { width: calc(100% - 244px); min-height: 100vh; margin-left: 244px; }
    .topbar {
      display: flex;
      height: 76px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 clamp(24px, 5vw, 72px);
      border-bottom: 1px solid var(--line);
      background: rgba(250, 248, 243, .68);
    }
    .breadcrumb { color: #9a988e; font-size: 13px; }
    .breadcrumb strong { color: #62645c; font-weight: 500; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .search-wrap { position: relative; width: min(310px, 32vw); }
    .search-wrap svg { position: absolute; top: 50%; left: 13px; width: 16px; height: 16px; color: #99978e; transform: translateY(-50%); pointer-events: none; }
    .search-input { width: 100%; height: 41px; padding: 0 13px 0 39px; border: 1px solid var(--line); border-radius: 8px; background: #fffefa; color: var(--ink); font-size: 13px; }
    .search-input::placeholder { color: #aaa79f; }
    .button-primary {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 15px;
      border: 1px solid var(--olive);
      border-radius: 8px;
      background: var(--olive);
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background .18s, transform .18s;
    }
    .button-primary:hover { transform: translateY(-1px); background: var(--olive-dark); }
    .button-primary svg { width: 15px; height: 15px; }
    .mobile-brand { display: none; }
    .content { max-width: 1440px; margin: 0 auto; padding: 49px clamp(24px, 5vw, 72px) 65px; }
    .eyebrow { margin: 0 0 10px; color: var(--clay); font-size: 10px; font-weight: 700; letter-spacing: 1.7px; text-transform: uppercase; }
    h1 { margin: 0; font: 500 clamp(31px, 3.3vw, 43px)/1.16 var(--serif); letter-spacing: -1.05px; }
    .intro { max-width: 500px; margin: 12px 0 0; color: #85847b; font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 0; }
    .stat-card { display: flex; min-height: 80px; align-items: center; gap: 13px; padding: 15px 17px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 254, 250, .72); }
    .stat-icon { display: grid; width: 37px; height: 37px; place-items: center; border-radius: 10px; background: var(--surface-warm); color: var(--olive); }
    .stat-icon svg { width: 17px; height: 17px; }
    .stat-value { font: 600 21px/1 var(--serif); font-variant-numeric: tabular-nums; }
    .stat-label { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .collection-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-top: 45px; margin-bottom: 16px; }
    .section-title { margin: 0; font: 600 22px/1.2 var(--serif); }
    .result-count { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .collection-controls { display: flex; align-items: center; gap: 14px; }
    .sort-wrap { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .sort-select { padding: 8px 26px 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: #55574f; font-size: 12px; }
    .active-filters { display: flex; min-height: 27px; align-items: center; gap: 7px; margin-bottom: 12px; }
    .filter-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 30px; background: var(--olive-pale); color: var(--olive-dark); font-size: 11px; font-weight: 600; }
    .clear-filter { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 11px; text-decoration: underline; }
    .library-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
    .item-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); transition: box-shadow .2s, border-color .2s; }
    .item-card:hover { border-color: #d7d4cb; box-shadow: 0 8px 24px rgba(48, 45, 37, .055); }
    .card-summary { display: flex; width: 100%; min-height: 148px; align-items: stretch; gap: 16px; padding: 0 16px 0 0; border: 0; background: transparent; cursor: pointer; text-align: left; }
    .mini-cover { width: 108px; height: 148px; min-height: 0; flex: none; align-self: flex-start; overflow: hidden; border-radius: 0; background: #e9e3d7; }
    .mini-cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .summary-copy { min-width: 0; flex: 1; align-self: center; padding: 13px 0; }
    .format-label { display: block; margin-bottom: 6px; color: #a09c91; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .card-title { display: -webkit-box; overflow: hidden; margin: 0; font: 600 17px/1.3 var(--serif); text-overflow: ellipsis; white-space: normal; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .card-author { display: block; overflow: hidden; margin-top: 6px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .item-card.expanded .card-title,
    .item-card.expanded .card-author { display: block; overflow: visible; overflow-wrap: anywhere; text-overflow: clip; white-space: normal; -webkit-line-clamp: unset; }
    .card-chevron { width: 15px; height: 15px; flex: none; color: #aaa79e; transition: transform .2s; }
    .item-card.expanded .card-chevron { transform: rotate(180deg); }
    .card-details { display: none; padding: 12px 13px 14px; }
    .item-card.expanded .card-details { display: block; }
    .summary-genres { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { padding: 4px 8px; border-radius: 30px; background: #f3f1eb; color: #77766d; font-size: 9px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-bottom: 12px; }
    .status-label { color: var(--muted); font-size: 10px; }
    .status-select { max-width: 130px; padding: 6px 23px 6px 9px; border: 1px solid #e6e5dc; border-radius: 6px; background: #fbfaf6; color: var(--olive-dark); font-size: 10px; font-weight: 600; }
    .notes-label { margin-bottom: 5px; color: #79796f; font-size: 10px; font-weight: 600; }
    .notes-input { display: block; width: 100%; min-height: 62px; resize: vertical; padding: 8px 9px; border: 1px solid #ebe8e1; border-radius: 6px; background: #fbfaf7; color: #5e5e56; font-size: 10px; line-height: 1.55; }
    .notes-input::placeholder { color: #aaa79e; }
    .detail-footer { display: flex; align-items: center; justify-content: flex-end; margin-top: 11px; }
    .menu-wrap { position: relative; }
    .more-button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: white; color: #5f6058; cursor: pointer; font-size: 10px; }
    .more-button svg { width: 13px; height: 13px; }
    .menu-popover { position: absolute; right: 0; bottom: calc(100% + 5px); z-index: 2; display: none; min-width: 120px; padding: 4px; border: 1px solid var(--line); border-radius: 7px; background: white; box-shadow: var(--shadow); }
    .menu-popover.open { display: block; }
    .menu-option { display: block; width: 100%; padding: 8px 9px; border: 0; border-radius: 4px; background: white; cursor: pointer; text-align: left; font-size: 10px; }
    .menu-option:hover { background: #f5f3ee; }
    .menu-option.danger { color: #a45243; }
    .empty-state { grid-column: 1 / -1; padding: 54px 20px; border: 1px dashed #d9d5cb; border-radius: 10px; color: var(--muted); text-align: center; }
    .empty-icon { display: grid; width: 44px; height: 44px; place-items: center; margin: 0 auto 13px; border-radius: 50%; background: var(--surface-warm); color: var(--olive); }
    .empty-icon svg { width: 21px; height: 21px; }
    .empty-title { margin: 0; color: var(--ink); font: 600 18px var(--serif); }
    .empty-copy { margin: 7px 0 16px; font-size: 11px; }
    .overlay { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(37, 39, 33, .38); backdrop-filter: blur(3px); }
    .overlay.open { display: flex; }
    .modal { width: min(510px, 100%); max-height: min(90vh, 760px); overflow: auto; padding: 25px; border: 1px solid rgba(255,255,255,.6); border-radius: 14px; background: #fffefa; box-shadow: 0 24px 70px rgba(27, 29, 24, .2); }
    .modal-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 19px; }
    .modal-title { margin: 0; font: 600 23px/1.2 var(--serif); }
    .modal-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .close-button { display: grid; width: 31px; height: 31px; flex: none; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: white; color: #77786f; cursor: pointer; }
    .close-button svg { width: 14px; height: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 12px; }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 5px; color: #6c6d64; font-size: 10px; font-weight: 600; }
    .field input, .field select, .field textarea { width: 100%; min-height: 39px; padding: 9px 10px; border: 1px solid #e4e1d9; border-radius: 7px; background: white; color: var(--ink); font-size: 11px; }
    .field textarea { min-height: 76px; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: #aaa79e; }
    .form-hint { margin-top: 4px; color: #99968e; font-size: 9px; }
    .modal-actions { display: flex; justify-content: end; gap: 8px; margin-top: 20px; }
    .button-secondary { min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 7px; background: white; color: #66675f; cursor: pointer; font-size: 11px; }
    .button-secondary:hover { background: #f6f4ee; }
    .toast { position: fixed; right: 24px; bottom: 22px; z-index: 20; max-width: min(390px, calc(100vw - 32px)); padding: 11px 15px; border: 1px solid #dfe3d8; border-radius: 8px; background: #fffefa; box-shadow: var(--shadow); color: var(--olive-dark); font-size: 11px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .2s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .file-input { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
    *, *::before, *::after { border-radius: 0 !important; }
    @media (max-width: 1100px) {
      .library-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .content { padding-right: 32px; padding-left: 32px; }
      .topbar { padding-right: 32px; padding-left: 32px; }
      .collection-head { flex-direction: column; align-items: stretch; gap: 12px; }
      .collection-controls { justify-content: space-between; }
    }
    @media (max-width: 900px) {
      .library-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .sidebar { position: static; width: 100%; height: auto; padding: 14px 18px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
      .app-shell { display: block; }
      .brand { padding: 0; }
      .brand-mark { width: 33px; height: 33px; border-radius: 10px; }
      .brand-name { font-size: 21px; }
      .side-label, .sidebar-bottom { display: none; }
      .nav-list { display: flex; gap: 5px; overflow-x: auto; margin: 12px -4px 0; padding: 0 4px 2px; scrollbar-width: none; }
      .nav-list::-webkit-scrollbar { display: none; }
      .nav-item { width: auto; min-width: max-content; gap: 7px; padding: 7px 9px; font-size: 11px; }
      .nav-item svg { width: 14px; height: 14px; }
      .nav-count { display: none; }
      .main { width: 100%; margin-left: 0; }
      .topbar { height: 64px; padding: 0 18px; }
      .breadcrumb { display: none; }
      .search-wrap { width: min(245px, 48vw); }
      .search-input { height: 37px; }
      .button-primary { min-height: 37px; padding: 0 11px; }
      .button-primary .button-text { display: none; }
      .content { padding: 34px 18px 48px; }
      .stats { gap: 8px; margin-top: 24px; }
      .stat-card { min-height: 72px; gap: 8px; padding: 10px; }
      .stat-icon { width: 30px; height: 30px; }
      .stat-value { font-size: 18px; }
      .stat-label { font-size: 9px; }
      .collection-head { margin-top: 34px; }
    }
    @media (max-width: 520px) {
      .library-grid { grid-template-columns: 1fr; gap: 12px; }
      .card-summary { min-height: 128px; gap: 14px; padding-right: 13px; }
      .mini-cover { width: 92px; height: 126px; }
      .card-title { font-size: 16px; }
      .stats { grid-template-columns: repeat(3, 1fr); }
      .stat-card { display: block; min-height: 82px; }
      .stat-icon { margin-bottom: 8px; }
      .stat-value { font-size: 16px; }
      .stat-label { margin-top: 3px; }
      .collection-head { flex-direction: column; align-items: stretch; gap: 12px; }
      .collection-controls { gap: 8px; }
      .collection-controls .sort-wrap { min-width: 0; flex: 1; }
      .sort-wrap { gap: 4px; font-size: 0; }
      .sort-select { width: 100%; min-width: 0; font-size: 10px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .modal { padding: 20px 17px; }
      h1 { font-size: 33px; }
      .intro { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Library navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8M8 11h7"/></svg>
        </div>
        <div><div class="brand-name">Archive</div></div>
      </div>
      <div class="side-label">My collection</div>
      <nav class="nav-list" id="format-nav" aria-label="Filter by format"></nav>
      <div class="sidebar-bottom">
        <div class="import-card">
          <button class="import-link" type="button" id="import-button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
            Import database file
          </button>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">Collection <span aria-hidden="true">/</span> <strong id="breadcrumb-current">All items</strong></div>
        <div class="top-actions">
          <label class="search-wrap">
            <span class="sr-only">Search title, author, genre, year, format, or status</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
            <input id="search-input" class="search-input" type="search" placeholder="Search your library…" autocomplete="off">
          </label>
          <button id="add-button" class="button-primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span class="button-text">Add item</span>
          </button>
        </div>
      </header>
      <div class="content">
        <section class="stats" aria-label="Collection summary">
          <div class="stat-card"><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8"/></svg></div><div><div class="stat-value" id="stat-total">0</div><div class="stat-label">Items collected</div></div></div>
          <div class="stat-card"><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8M8 11h6"/></svg></div><div><div class="stat-value" id="stat-read">0</div><div class="stat-label">Read or watched</div></div></div>
          <div class="stat-card"><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8M8 11h6"/></svg></div><div><div class="stat-value" id="stat-unread">0</div><div class="stat-label">Still to discover</div></div></div>
        </section>
        <section aria-labelledby="collection-title">
          <div class="collection-head">
            <div><h2 class="section-title" id="collection-title">My collection</h2><div class="result-count" id="result-count"></div></div>
            <div class="collection-controls">
              <label class="sort-wrap">Filter
                <select id="status-filter" class="sort-select" aria-label="Filter by reading or watching status">
                  <option value="all">All statuses</option>
                  <option value="completed">Read or watched</option>
                  <option value="pending">Unread or unwatched</option>
                </select>
              </label>
              <label class="sort-wrap">Sort by
                <select id="sort-select" class="sort-select" aria-label="Sort items">
                  <option value="recent">Recently added</option>
                  <option value="title">Title, A–Z</option>
                  <option value="author">Author, A–Z</option>
                  <option value="year">Year, newest</option>
                </select>
              </label>
            </div>
          </div>
          <div class="active-filters" id="active-filters"></div>
          <div class="library-grid" id="library-grid" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
  <input class="file-input" id="xlsx-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
  <div class="overlay" id="item-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form class="modal" id="item-form">
      <div class="modal-head">
        <div><h2 class="modal-title" id="modal-title">Add to your library</h2><p class="modal-subtitle">A few details are all it takes to keep it close.</p></div>
        <button class="close-button" id="close-modal" type="button" aria-label="Close dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <input id="item-id" type="hidden">
      <div class="form-grid">
        <div class="field full"><label for="field-title">Title <span aria-hidden="true">*</span></label><input id="field-title" name="title" required maxlength="160" placeholder="What is it called?"></div>
        <div class="field"><label for="field-authors">Author(s)</label><input id="field-authors" name="authors" maxlength="160" placeholder="Separate names with commas"></div>
        <div class="field"><label for="field-year">Year</label><input id="field-year" name="year" type="number" min="0" max="9999" placeholder="e.g. 2024"></div>
        <div class="field"><label for="field-format">Format <span aria-hidden="true">*</span></label><select id="field-format" name="format" required><option value="Film">Film</option><option value="TV series">TV series</option><option value="Book">Book</option><option value="Article">Article</option></select></div>
        <div class="field"><label for="field-status">Status</label><select id="field-status" name="status"></select></div>
        <div class="field full"><label for="field-genres">Genre(s)</label><input id="field-genres" name="genres" maxlength="180" placeholder="e.g. Drama, coming-of-age"><div class="form-hint">Separate genres with commas.</div></div>
        <div class="field full"><label for="field-cover">Cover image URL <span style="font-weight:400;color:#999">(optional)</span></label><input id="field-cover" name="cover" type="url" placeholder="https://…"><div class="form-hint">Leave blank for a custom illustrated cover.</div></div>
        <div class="field full"><label for="field-notes">Notes <span style="font-weight:400;color:#999">(optional)</span></label><textarea id="field-notes" name="notes" maxlength="2000" placeholder="A thought, a favourite passage, where you heard about it…"></textarea></div>
      </div>
      <div class="modal-actions"><button class="button-secondary" id="cancel-modal" type="button">Cancel</button><button class="button-primary" type="submit"><span id="save-label">Add to collection</span></button></div>
    </form>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const STORAGE_KEY = "library.items.v1";
      const formats = ["All items", "Film", "TV series", "Book", "Article"];
      const statusByFormat = {
        Film: ["Watched", "Unwatched"],
        "TV series": ["Watched", "Unwatched"],
        Book: ["Read", "Unread"],
        Article: ["Read", "Unread"]
      };
      const palette = [
        ["#36494a", "#b28a68"], ["#745a4c", "#d0aa78"], ["#566358", "#b9a68c"],
        ["#55506b", "#c5a18e"], ["#71614f", "#c8a07b"], ["#49565f", "#bd957f"],
        ["#665048", "#d0b38b"], ["#5d6554", "#c2a887"]
      ];
      const icons = {
        "All items": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="7" rx="1"/><rect x="14" y="4" width="6" height="7" rx="1"/><rect x="4" y="15" width="6" height="5" rx="1"/><rect x="14" y="15" width="6" height="5" rx="1"/></svg>',
        Film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></svg>',
        "TV series": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="m9 21 3-3 3 3M8 2l4 3 4-3"/></svg>',
        Book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8M8 11h7"/></svg>',
        Article: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M8 12h8M8 16h8"/></svg>'
      };
      const seedItems = [
        { id: "seed-1", title: "Past Lives", authors: "Celine Song", genres: "Romance, Drama", year: 2023, format: "Film", status: "Watched", notes: "A tender meditation on the lives we might have lived." },
        { id: "seed-2", title: "The Bear", authors: "Christopher Storer", genres: "Drama, Comedy", year: 2022, format: "TV series", status: "Unwatched", notes: "" },
        { id: "seed-3", title: "Crying in H Mart", authors: "Michelle Zauner", genres: "Memoir, Food", year: 2021, format: "Book", status: "Read", notes: "Beautifully written, and best read with something simmering." },
        { id: "seed-4", title: "Ways of Seeing", authors: "John Berger", genres: "Art, Essays", year: 1972, format: "Book", status: "Unread", notes: "" },
        { id: "seed-5", title: "The Creative Independent", authors: "Various authors", genres: "Creativity, Interview", year: 2024, format: "Article", status: "Read", notes: "A collection of thoughtful conversations about making things." },
        { id: "seed-6", title: "In the Mood for Love", authors: "Wong Kar-wai", genres: "Romance, Drama", year: 2000, format: "Film", status: "Unwatched", notes: "" }
      ];

      const $ = (selector, root = document) => root.querySelector(selector);
      const grid = $("#library-grid");
      const nav = $("#format-nav");
      let activeFormat = "All items";
      let activeStatus = "all";
      let searchTerm = "";
      let toastTimer;
      let items = loadItems();

      function loadItems() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored === null) return seedItems.map(item => ({ ...item }));
          const parsed = JSON.parse(stored);
          if (!Array.isArray(parsed)) throw new Error("Saved library data is not a list.");
          return parsed.filter(item => item && typeof item.title === "string" && statusByFormat[item.format]);
        } catch (error) {
          console.error("Could not load saved library items.", error);
          return seedItems.map(item => ({ ...item }));
        }
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        } catch (error) {
          console.error("Could not save library changes.", error);
          showToast("Your browser could not save this change. Check available storage.");
        }
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }

      function coverData(item, index) {
        const [dark, light] = palette[index % palette.length];
        const title = String(item.title || "Untitled").slice(0, 38);
        const lines = title.match(/.{1,18}/g) || [title];
        const titleSvg = lines.slice(0, 3).map((line, i) =>
          `<text x="26" y="${194 + i * 31}" font-family="Georgia,serif" font-size="24" fill="#fffaf0">${escapeHtml(line)}</text>`
        ).join("");
        const mark = item.format === "Film" ? "✳" : item.format === "TV series" ? "◌" : item.format === "Article" ? "¶" : "❧";
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${dark}"/><stop offset="1" stop-color="${light}"/></linearGradient><radialGradient id="r"><stop stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="360" height="470" fill="url(#g)"/><circle cx="280" cy="100" r="160" fill="url(#r)"/><path d="M0 350Q130 235 360 320V470H0Z" fill="#211e1a" fill-opacity=".15"/><text x="27" y="48" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#fffaf0" fill-opacity=".8">${escapeHtml(item.format || "COLLECTION").toUpperCase()}</text><text x="268" y="170" font-family="Georgia,serif" font-size="95" fill="#fffaf0" fill-opacity=".18">${mark}</text>${titleSvg}<text x="27" y="430" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" fill="#fffaf0" fill-opacity=".8">${escapeHtml(item.year || "LIBRARY")}</text></svg>`;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }

      function itemCover(item) {
        return item.cover ? escapeHtml(item.cover) : coverData(item, Math.max(items.indexOf(item), 0));
      }

      function renderNav() {
        nav.innerHTML = formats.map(format => {
          const count = format === "All items" ? items.length : items.filter(item => item.format === format).length;
          return `<button type="button" class="nav-item ${activeFormat === format ? "active" : ""}" data-format="${escapeHtml(format)}" aria-pressed="${activeFormat === format}">${icons[format]}<span>${escapeHtml(format)}</span><span class="nav-count">${count}</span></button>`;
        }).join("");
      }

      function renderStatusFilter() {
        const options = activeFormat === "All items"
          ? [
            { value: "all", label: "All" },
            { value: "completed", label: "Read or watched" },
            { value: "pending", label: "Unread or unwatched" }
          ]
          : [
            { value: "all", label: "All" },
            { value: "completed", label: statusByFormat[activeFormat][0] },
            { value: "pending", label: statusByFormat[activeFormat][1] }
          ];
        $("#status-filter").innerHTML = options.map(option =>
          `<option value="${option.value}" ${activeStatus === option.value ? "selected" : ""}>${option.label}</option>`
        ).join("");
      }

      function visibleItems() {
        const query = searchTerm.trim().toLocaleLowerCase();
        const results = items.filter(item => {
          const matchesFormat = activeFormat === "All items" || item.format === activeFormat;
          const matchesStatus = activeStatus === "all" ||
            (activeStatus === "completed" && ["Read", "Watched"].includes(item.status)) ||
            (activeStatus === "pending" && ["Unread", "Unwatched"].includes(item.status));
          const searchable = [item.title, item.authors, item.genres, item.year, item.format, item.status].join(" ").toLocaleLowerCase();
          return matchesFormat && matchesStatus && (!query || searchable.includes(query));
        });
        const sort = $("#sort-select").value;
        if (sort === "title") results.sort((a, b) => a.title.localeCompare(b.title));
        else if (sort === "author") results.sort((a, b) => {
          const authorA = String(a.authors || "").trim();
          const authorB = String(b.authors || "").trim();
          if (!authorA || !authorB) return authorA ? -1 : authorB ? 1 : a.title.localeCompare(b.title);
          return authorA.localeCompare(authorB, undefined, { sensitivity: "base" }) || a.title.localeCompare(b.title);
        });
        else if (sort === "year") results.sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0) || a.title.localeCompare(b.title));
        else results.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        return results;
      }

      function renderGrid() {
        const results = visibleItems();
        $("#result-count").textContent = `${results.length} ${results.length === 1 ? "item" : "items"}${searchTerm || activeFormat !== "All items" || activeStatus !== "all" ? " found" : ""}`;
        $("#breadcrumb-current").textContent = activeFormat;
        const filterParts = [];
        if (activeFormat !== "All items") filterParts.push(`<span class="filter-chip">${escapeHtml(activeFormat)}</span>`);
        if (activeStatus !== "all") {
          const statusLabel = activeFormat === "All items"
            ? activeStatus === "completed" ? "Read or watched" : "Unread or unwatched"
            : statusByFormat[activeFormat][activeStatus === "completed" ? 0 : 1];
          filterParts.push(`<span class="filter-chip">${escapeHtml(statusLabel)}</span>`);
        }
        if (searchTerm) filterParts.push(`<span class="filter-chip">Search: “${escapeHtml(searchTerm)}”</span>`);
        $("#active-filters").innerHTML = filterParts.length ? `${filterParts.join("")}<button class="clear-filter" type="button" id="clear-filters">Clear filters</button>` : "";
        if (!results.length) {
          grid.innerHTML = `<div class="empty-state"><div class="empty-icon">${icons[activeFormat] || icons["All items"]}</div><h3 class="empty-title">${searchTerm ? "Nothing found just yet" : "A little space to fill"}</h3><p class="empty-copy">${searchTerm ? "Try another title, author, genre, year, format, or status." : "Add a favourite or import a spreadsheet to begin."}</p><button class="button-primary" type="button" data-action="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add an item</button></div>`;
          return;
        }
        grid.innerHTML = results.map((item, index) => {
          const id = escapeHtml(item.id);
          const genres = String(item.genres || "").split(",").map(value => value.trim()).filter(Boolean);
          const genreSummary = genres.join(" · ");
          const cover = itemCover(item);
          const statusOptions = statusByFormat[item.format].map(status => `<option value="${status}" ${item.status === status ? "selected" : ""}>${status}</option>`).join("");
          return `<article class="item-card" data-card="${id}">
            <button type="button" class="card-summary" data-action="expand" aria-expanded="false">
              <span class="mini-cover"><img src="${cover}" alt="" loading="lazy"></span>
              <span class="summary-copy"><span class="format-label">${escapeHtml(item.format)}${item.year ? ` · ${escapeHtml(item.year)}` : ""}</span><span class="card-title">${escapeHtml(item.title)}</span><span class="card-author">${escapeHtml(item.authors || "Author not listed")}</span>${genreSummary ? `<span class="summary-genres">${escapeHtml(genreSummary)}</span>` : ""}</span>
              <svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="card-details">
              <div class="status-row"><span class="status-label">Your status</span><select class="status-select" data-action="status" aria-label="Status for ${escapeHtml(item.title)}">${statusOptions}</select></div>
              <label class="notes-label" for="notes-${id}">Your notes</label><textarea class="notes-input" id="notes-${id}" data-action="notes" placeholder="Keep a thought or favourite detail…">${escapeHtml(item.notes || "")}</textarea>
              <div class="detail-footer"><div class="menu-wrap"><button type="button" class="more-button" data-action="menu" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Options</button><div class="menu-popover"><button type="button" class="menu-option" data-action="edit">Edit details</button><button type="button" class="menu-option danger" data-action="delete">Delete item</button></div></div></div>
            </div>
          </article>`;
        }).join("");
        grid.querySelectorAll(".item-card img").forEach((image, index) => {
          image.addEventListener("error", () => {
            const item = results[index % results.length];
            image.src = coverData(item, index);
          }, { once: true });
        });
      }

      function renderStats() {
        const completed = items.filter(item => ["Read", "Watched"].includes(item.status)).length;
        $("#stat-total").textContent = items.length;
        $("#stat-read").textContent = completed;
        $("#stat-unread").textContent = items.length - completed;
      }

      function render() {
        renderNav();
        renderStatusFilter();
        renderStats();
        renderGrid();
      }

      function showToast(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
      }

      function updateStatusOptions(selected) {
        const format = $("#field-format").value;
        $("#field-status").innerHTML = statusByFormat[format].map(status => `<option value="${status}" ${selected === status ? "selected" : ""}>${status}</option>`).join("");
      }

      function openModal(item) {
        const form = $("#item-form");
        form.reset();
        $("#item-id").value = item ? item.id : "";
        $("#modal-title").textContent = item ? "Edit item" : "Add to your library";
        $("#save-label").textContent = item ? "Save changes" : "Add to collection";
        $("#field-title").value = item?.title || "";
        $("#field-authors").value = item?.authors || "";
        $("#field-year").value = item?.year || "";
        $("#field-format").value = item?.format || "Film";
        $("#field-genres").value = item?.genres || "";
        $("#field-cover").value = item?.cover || "";
        $("#field-notes").value = item?.notes || "";
        updateStatusOptions(item?.status || statusByFormat[$("#field-format").value][0]);
        $("#item-overlay").classList.add("open");
        $("#field-title").focus();
      }

      function closeModal() {
        $("#item-overlay").classList.remove("open");
      }

      function normalizeList(value) {
        return String(value || "").split(/[;,]/).map(part => part.trim()).filter(Boolean).join(", ");
      }

      nav.addEventListener("click", event => {
        const button = event.target.closest("[data-format]");
        if (!button) return;
        activeFormat = button.dataset.format;
        render();
      });

      $("#search-input").addEventListener("input", event => {
        searchTerm = event.target.value;
        renderGrid();
      });
      $("#status-filter").addEventListener("change", event => {
        activeStatus = event.target.value;
        renderGrid();
      });
      $("#sort-select").addEventListener("change", renderGrid);
      $("#add-button").addEventListener("click", () => openModal());
      $("#import-button").addEventListener("click", () => $("#xlsx-input").click());
      $("#field-format").addEventListener("change", () => updateStatusOptions());
      $("#close-modal").addEventListener("click", closeModal);
      $("#cancel-modal").addEventListener("click", closeModal);
      $("#item-overlay").addEventListener("click", event => {
        if (event.target === $("#item-overlay")) closeModal();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeModal();
      });

      $("#item-form").addEventListener("submit", event => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const id = $("#item-id").value;
        const existing = items.find(item => item.id === id);
        const record = {
          id: id || (crypto.randomUUID ? crypto.randomUUID() : `item-${Date.now()}-${Math.random().toString(36).slice(2)}`),
          title: String(form.get("title")).trim(),
          authors: String(form.get("authors") || "").trim(),
          genres: normalizeList(form.get("genres")),
          year: form.get("year") ? Number(form.get("year")) : "",
          format: String(form.get("format")),
          status: String(form.get("status")),
          cover: String(form.get("cover") || "").trim(),
          notes: String(form.get("notes") || "").trim(),
          createdAt: existing?.createdAt || Date.now()
        };
        if (!record.title) return;
        if (existing) items = items.map(item => item.id === id ? record : item);
        else items.unshift(record);
        persist();
        render();
        closeModal();
        showToast(existing ? "Your changes have been saved." : "Added to your collection.");
      });

      $("#xlsx-input").addEventListener("change", async event => {
        const file = event.target.files[0];
        if (!file) return;
        if (!window.XLSX) {
          showToast("Spreadsheet support could not load. Check your internet connection and try again.");
          event.target.value = "";
          return;
        }
        try {
          const buffer = await file.arrayBuffer();
          const workbook = XLSX.read(buffer, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
          const imported = [];
          const skipped = [];
          rows.forEach((row, rowIndex) => {
            const fields = {};
            Object.entries(row).forEach(([key, value]) => {
              fields[key.trim().toLowerCase().replace(/[^a-z0-9]/g, "")] = value;
            });
            const title = fields.title || fields.name;
            const rawFormat = String(fields.format || fields.type || "").trim().toLowerCase();
            const format = ({ film: "Film", movie: "Film", tv: "TV series", tvseries: "TV series", series: "TV series", book: "Book", article: "Article" })[rawFormat];
            if (!title || !format) {
              skipped.push(rowIndex + 2);
              return;
            }
            const rawStatus = String(fields.status || "").trim().toLowerCase();
            const statusValues = statusByFormat[format];
            const status = statusValues.find(value => value.toLowerCase() === rawStatus) || statusValues[0];
            imported.push({
              id: crypto.randomUUID ? crypto.randomUUID() : `import-${Date.now()}-${rowIndex}`,
              title: String(title).trim(),
              authors: String(fields.authors || fields.author || "").trim(),
              genres: normalizeList(fields.genres || fields.genre || ""),
              year: fields.year ? Number(fields.year) || String(fields.year).trim() : "",
              format,
              status,
              notes: String(fields.notes || "").trim(),
              cover: String(fields.cover || fields.coverurl || "").trim(),
              createdAt: Date.now() + rowIndex
            });
          });
          if (!imported.length) {
            showToast("No valid rows found. Add Title and Format columns to your first sheet.");
          } else {
            items = [...imported, ...items];
            persist();
            render();
            const skippedText = skipped.length ? ` ${skipped.length} row${skipped.length === 1 ? "" : "s"} skipped (missing title or valid format).` : "";
            showToast(`${imported.length} item${imported.length === 1 ? "" : "s"} imported.${skippedText}`);
          }
        } catch (error) {
          console.error("Could not import spreadsheet.", error);
          showToast("This spreadsheet could not be read. Please choose a valid .xlsx file.");
        } finally {
          event.target.value = "";
        }
      });

      grid.addEventListener("input", event => {
        const textarea = event.target.closest('[data-action="notes"]');
        if (!textarea) return;
        const card = textarea.closest("[data-card]");
        const item = items.find(record => record.id === card.dataset.card);
        if (item) {
          item.notes = textarea.value;
          persist();
        }
      });

      grid.addEventListener("change", event => {
        const select = event.target.closest('[data-action="status"]');
        if (!select) return;
        const item = items.find(record => record.id === select.closest("[data-card]").dataset.card);
        if (!item) return;
        item.status = select.value;
        persist();
        renderStats();
        renderNav();
        renderGrid();
        showToast(`Marked ${item.status.toLowerCase()}.`);
      });

      grid.addEventListener("click", event => {
        const action = event.target.closest("[data-action]");
        if (!action) return;
        const type = action.dataset.action;
        const card = action.closest("[data-card]");
        if (type === "add") {
          openModal();
          return;
        }
        if (type === "expand") {
          const expanded = card.classList.toggle("expanded");
          action.setAttribute("aria-expanded", String(expanded));
          return;
        }
        if (!card) return;
        const item = items.find(record => record.id === card.dataset.card);
        if (!item) return;
        if (type === "menu") {
          const menu = action.nextElementSibling;
          const open = menu.classList.toggle("open");
          action.setAttribute("aria-expanded", String(open));
          return;
        }
        if (type === "edit") {
          openModal(item);
          return;
        }
        if (type === "delete") {
          if (!window.confirm(`Delete “${item.title}” from your library?`)) return;
          items = items.filter(record => record.id !== item.id);
          persist();
          render();
          showToast("Item removed from your collection.");
        }
      });

      $("#active-filters").addEventListener("click", event => {
        if (!event.target.closest("#clear-filters")) return;
        activeFormat = "All items";
        activeStatus = "all";
        searchTerm = "";
        $("#search-input").value = "";
        $("#status-filter").value = "all";
        render();
      });

      document.addEventListener("click", event => {
        if (event.target.closest(".menu-wrap")) return;
        document.querySelectorAll(".menu-popover.open").forEach(menu => {
          menu.classList.remove("open");
          menu.previousElementSibling.setAttribute("aria-expanded", "false");
        });
      });

      render();
    })();
  </script>
</body>
</html>
